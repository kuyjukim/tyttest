name: paper
description: >-
  Shared design system for the tyttest app suite: tokens, themes, motion rules,
  primitive widgets, a pluggable key-value store and a dependency-free
  Listenable scope. Deliberately has no plugin dependencies so that it stays
  trivially unit-testable on every platform.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  # Cupertino widgets reach for this font family (SettingSwitch uses
  # Switch.adaptive), and without the package in the graph every build warns
  # that it cannot find the faces. Declared here rather than in each app
  # because this package is what pulls Cupertino in.
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  # From the SDK, so still no third-party dependency. Needed because a Korean
  # locale without GlobalMaterialLocalizations leaves every stock Material
  # affordance - selection menus, pickers, semantics labels - in English.
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter: {}
