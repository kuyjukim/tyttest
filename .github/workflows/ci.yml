name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per package: a failure then names the package in the job
        # list rather than hiding in the middle of one long log.
        package:
          - packages/paper
          - apps/grove
          - apps/inkwell
          - apps/ledger
          - apps/stroke
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: an unpinned toolchain turns an unrelated SDK release into
          # a surprise red build on an unchanged branch.
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ matrix.package }}
        run: flutter test

  timezones:
    name: Calendar arithmetic in other time zones
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/paper, apps/grove, apps/ledger]
        # One zone with DST and one on a half-hour offset. Day and month
        # arithmetic that leans on a 24-hour Duration passes in UTC and fails
        # in exactly these.
        timezone: [America/New_York, Asia/Kolkata]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: Test
        working-directory: ${{ matrix.package }}
        env:
          TZ: ${{ matrix.timezone }}
        run: flutter test

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [grove, inkwell, ledger, stroke]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      # The cheapest end-to-end compile available on a Linux runner: it
      # catches the whole app failing to build, which `flutter test` does not,
      # because tests only compile the libraries they import.
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: flutter build web --release

  # The two builds this repository cannot run on its own machine. The Linux
  # container has no Android SDK - only dl.google.com serves the platform
  # jars, and the network policy denies it - and no container has Xcode at
  # all. GitHub's runners have both, so the platform configuration gets
  # compiled here or it gets compiled for the first time by whoever submits
  # it.
  #
  # Ledger only, on purpose: it is the one app whose iOS and Android config
  # is not the `flutter create` template, and a macOS runner bills at ten
  # times the rate of a Linux one.
  android-build:
    name: Android build (Ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - name: Resource references resolve
        run: tool/check_android_res.py
      - name: Dependencies
        working-directory: apps/ledger
        run: flutter pub get
      # The signing block, locales_config.xml and the adaptive icon are all
      # compiled for the first time here. Without android/key.properties the
      # Gradle script falls back to the debug key and says so, which is the
      # path a contributor takes and therefore the one worth testing.
      - name: Build app bundle
        working-directory: apps/ledger
        run: flutter build appbundle --release
      - name: Build APK
        working-directory: apps/ledger
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-android
          path: |
            apps/ledger/build/app/outputs/bundle/release/*.aab
            apps/ledger/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios-build:
    name: iOS build (Ledger)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: apps/ledger
        run: flutter pub get
      # --no-codesign, because signing needs a team and a provisioning
      # profile that do not belong in a repository. Everything short of
      # signing still compiles: the Xcode project, Info.plist, the asset
      # catalogue and the pod install.
      - name: Build
        working-directory: apps/ledger
        run: flutter build ios --release --no-codesign
      # PrivacyInfo.xcprivacy and the InfoPlist.strings files exist on disk
      # but are not referenced by project.pbxproj, so they are not copied
      # into the bundle. Apple rejects an upload without the privacy
      # manifest, and the rejection arrives after the binary does.
      - name: Privacy manifest and localisations are in the bundle
        working-directory: apps/ledger
        run: |
          app=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "bundle: $app"
          missing=0
          for path in PrivacyInfo.xcprivacy en.lproj ko.lproj; do
            if [ -e "$app/$path" ]; then
              echo "  ok       $path"
            else
              echo "  MISSING  $path"
              missing=1
            fi
          done
          exit $missing
